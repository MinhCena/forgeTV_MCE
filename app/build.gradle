plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.forge.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.forge.launcher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khóa debug để cài thẳng (sideload) lên box; không dùng để lên Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
