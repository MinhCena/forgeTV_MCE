name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Restore signing key from Secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "Thiếu secret KEYSTORE_BASE64"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -Pvc=${{ github.run_number }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" MinhCenaTV.apk
          gh release create "v${{ github.run_number }}" MinhCenaTV.apk --latest --title "Minh Cena TV 1.0.${{ github.run_number }}"
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
